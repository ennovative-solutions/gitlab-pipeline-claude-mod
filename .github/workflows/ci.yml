name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check that every JSON file is valid
        run: |
          node -e '
            const fs = require("fs")
            const files = require("child_process").execSync("git ls-files \"*.json\"").toString().split("\n").filter(Boolean)
            let isValid = true
            for (const file of files) {
              try { JSON.parse(fs.readFileSync(file, "utf8")) } catch (error) { console.error(`${file}: ${error.message}`); isValid = false }
            }
            console.log(`Checked ${files.length} JSON files`)
            process.exit(isValid ? 0 : 1)
          '

      - name: Check that the versions match
        run: |
          node -e '
            const read = file => JSON.parse(require("fs").readFileSync(file, "utf8"))
            const lock = read("package-lock.json")
            const versions = {
              ".claude-plugin/plugin.json": read(".claude-plugin/plugin.json").version,
              "package.json": read("package.json").version,
              "package-lock.json": lock.version,
              "package-lock.json (root package)": lock.packages[""].version,
            }
            for (const [file, version] of Object.entries(versions)) console.log(`${file}: ${version}`)
            if (new Set(Object.values(versions)).size !== 1) {
              console.error("The versions differ. Set the same version in each file.")
              process.exit(1)
            }
          '

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action needs a (free) license key for repositories owned by an organization.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: false

  # Tags each new version on main as v<version>, once every check has passed.
  tag:
    needs: [validate, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Tag the version
        run: |
          version=$(node -p 'require("./.claude-plugin/plugin.json").version')
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to tag."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "ci-pipeline-status $version"
          git push origin "$tag"
          echo "Tagged $GITHUB_SHA as $tag."
