name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check that every JSON file is valid
        run: |
          node -e '
            const fs = require("fs")
            const files = require("child_process").execSync("git ls-files \"*.json\"").toString().split("\n").filter(Boolean)
            let isValid = true
            for (const file of files) {
              try { JSON.parse(fs.readFileSync(file, "utf8")) } catch (error) { console.error(`${file}: ${error.message}`); isValid = false }
            }
            console.log(`Checked ${files.length} JSON files`)
            process.exit(isValid ? 0 : 1)
          '

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action needs a (free) license key for repositories owned by an organization.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: false
